name: CI Pipeline - AgendaYA

on:
  push:
    branches: [ "main", "tp7" ]
  pull_request:
    branches: [ "main", "tp7" ]

jobs:
  quality-and-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Comprobación de tipos (TypeScript)
      run: npx tsc --noEmit

    - name: Análisis de código estático (ESLint)
      run: npm run lint

    - name: Ejecutar pruebas unitarias con Cobertura
      run: npm test -- --coverage

    - name: Construir proyecto (Build)
      run: npm run build

    - name: Pruebas End-to-End (Cypress)
      uses: cypress-io/github-action@v6
      with:
        install: false
        start: npm start
        wait-on: 'http://localhost:3000'

    - name: Subir capturas en caso de fallos de Cypress
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots
        if-no-files-found: ignore
